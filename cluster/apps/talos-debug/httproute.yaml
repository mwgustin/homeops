apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: talos-recovery
  namespace: kube-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: envoy-gateway
  hostnames:
    - talos-recovery.internal.gustend.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: talos-debug
          port: 8080
          weight: 1
