apiVersion: apps/v1
kind: Deployment
metadata:
  name: talos-debug
  namespace: kube-system
  labels:
    app.kubernetes.io/name: talos-debug
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: talos-debug
  template:
    metadata:
      labels:
        app.kubernetes.io/name: talos-debug
    spec:
      nodeName: talos-cp1
      hostNetwork: true
      hostPID: true
      containers:
        - name: recovery
          image: alpine
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ -r /talos-state/config.yaml ]; then
                echo "BEGIN TALOS MACHINE CONFIG"
                base64 /talos-state/config.yaml
                echo "END TALOS MACHINE CONFIG"
              else
                echo "TALOS MACHINE CONFIG UNAVAILABLE"
              fi
              exec tail -f /dev/null
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: talos-state
              mountPath: /talos-state
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
        - name: talos-state
          hostPath:
            path: /system/state
            type: Directory
