apiVersion: apps/v1
kind: Deployment
metadata:
  name: talos-debug
  namespace: kube-system
  labels:
    app.kubernetes.io/name: talos-debug
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: talos-debug
  template:
    metadata:
      labels:
        app.kubernetes.io/name: talos-debug
    spec:
      nodeName: talos-cp1
      hostNetwork: true
      hostPID: true
      containers:
        - name: recovery
          image: alpine
          command: ["/bin/sh", "-ec"]
          args:
            - |
              echo "BEGIN TALOS MACHINE CONFIG"
              mkdir -p /recovery
              base64 /host/system/state/config.yaml > /recovery/machineconfig.b64
              cat /recovery/machineconfig.b64
              echo "END TALOS MACHINE CONFIG"
              exec httpd -f -p 8080 -h /recovery
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
