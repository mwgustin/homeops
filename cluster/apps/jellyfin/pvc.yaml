apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
spec:
  volumeName: pvc-67abd909-c503-4103-bb24-cf2e7a655fb7
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: synology-iscsi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-cache
spec:
  volumeName: pvc-7ab937d5-b08d-4a1f-860e-95d2ca593f02
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: synology-iscsi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-nfs-media-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: library.gustend.local
    path: /volume1/Media
  storageClassName: jellyfin-nfs-library-media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-nfs-media-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName:  jellyfin-nfs-library-media